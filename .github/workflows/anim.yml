name: Anim

on:
  push:
    branches:
      - video
    paths:
      - "anim/**"
      - ".github/workflows/anim.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  eslint:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: anim

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: anim/package-lock.json
      - run: npm ci
      - run: npm run lint

  build:
    needs: [eslint]

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: anim/package-lock.json
      - name: Build animations page
        working-directory: anim
        run: |
          npm ci
          npm run build
      - name: Build helpdesk page
        working-directory: http
        run: |
          npm ci
          npm run build
      - name: Build chat page
        working-directory: sse-ws
        run: |
          npm ci
          npm run build
      - name: Build events page
        working-directory: events
        run: |
          yarn
          yarn build
      - name: Assemble site
        working-directory: .
        run: |
          mkdir -p site/http site/sse-ws site/anim
          cp -a events/dist/. site/
          cp -a http/dist/. site/http/
          cp -a sse-ws/dist/. site/sse-ws/
          cp -a anim/dist/. site/anim/
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
